openapi: 3.0.0
info:
  title: FoodFlow ERP REST API
  description: API Layanan Manajemen Katering & Dapur Sentral FoodFlow (Pertemuan 10)
  version: 1.0.0
servers:
  - url: http://127.0.0.1:8000/api/v1
    description: Local Development Server
paths:
  /login:
    post:
      summary: Login dan dapatkan Personal Access Token Sanctum
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  example: admin@foodflow.test
                password:
                  type: string
                  example: password
      responses:
        '200':
          description: Token berhasil diterbitkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  token_type:
                    type: string
                    example: Bearer
                  expires_at:
                    type: string
                  user:
                    type: object
        '401':
          description: Kredensial tidak valid
        '429':
          description: Terlalu banyak percobaan login (Rate Limited)

  /logout:
    post:
      summary: Logout dan cabut token aktif
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout berhasil

  /ingredients:
    get:
      summary: Ambil daftar master bahan baku gudang berpaginasi
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          description: Kata kunci pencarian nama atau kategori
          schema:
            type: string
        - name: category
          in: query
          description: Filter kategori spesifik
          schema:
            type: string
        - name: sort
          in: query
          description: Pengurutan data (name, -name, current_stock, -current_stock)
          schema:
            type: string
        - name: per_page
          in: query
          description: Jumlah baris per halaman (maksimal 100)
          schema:
            type: integer
      responses:
        '200':
          description: Daftar bahan baku berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        category:
                          type: string
                        unit:
                          type: string
                        current_stock:
                          type: number
                        minimum_stock:
                          type: number
                        is_low_stock:
                          type: boolean
        '401':
          description: Tidak terautentikasi (Token tidak ada atau salah)
        '403':
          description: Token tidak memiliki ability ingredients:read

  /products:
    get:
      summary: Ambil katalog menu hidangan & profil gizi berpaginasi
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
        - name: per_page
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Katalog menu hidangan berhasil diambil
        '401':
          description: Tidak terautentikasi

  /catering-orders:
    get:
      summary: Ambil daftar pesanan katering berpaginasi
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          description: Pencarian nomor order atau nama pemesan
          schema:
            type: string
        - name: status
          in: query
          description: Filter status pesanan (pending, confirmed, processing, delivered, cancelled)
          schema:
            type: string
        - name: sort
          in: query
          description: Urutan data (id, -id, order_number, -order_number, delivery_date, -delivery_date, total_amount, -total_amount)
          schema:
            type: string
        - name: per_page
          in: query
          description: Jumlah baris per halaman (1-100)
          schema:
            type: integer
      responses:
        '200':
          description: Daftar pesanan katering berhasil diambil
        '401':
          description: Tidak terautentikasi
        '403':
          description: Token tidak memiliki ability orders:read

    post:
      summary: Buat pesanan katering baru (Dilindungi Idempotency-Key)
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: UUID unik request transaksi untuk mencegah pesanan dobel
          schema:
            type: string
            example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customer_id
                - delivery_date
                - items
              properties:
                customer_id:
                  type: integer
                  example: 1
                delivery_date:
                  type: string
                  format: date
                  example: 2026-11-20
                notes:
                  type: string
                  example: Pesanan makan siang rapat dinas
                items:
                  type: array
                  items:
                    type: object
                    required:
                      - product_id
                      - quantity
                    properties:
                      product_id:
                        type: integer
                        example: 1
                      quantity:
                        type: integer
                        example: 50
      responses:
        '201':
          description: Pesanan katering berhasil dicatat
        '400':
          description: Header Idempotency-Key tidak disertakan
        '409':
          description: Request dengan key yang sama sedang diproses
        '422':
          description: Data input tidak valid atau key digunakan untuk muatan data berbeda

  /catering-orders/{id}:
    get:
      summary: Ambil detail pesanan katering beserta item menu dan informasi pemesan
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID pesanan katering
          schema:
            type: integer
      responses:
        '200':
          description: Detail pesanan katering berhasil diambil
        '401':
          description: Tidak terautentikasi
        '403':
          description: Token tidak memiliki ability orders:read
        '404':
          description: Resource tidak ditemukan

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
